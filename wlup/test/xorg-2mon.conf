# Xorg for the RDP client in run-e2e.sh: two 800x600 monitors side by
# side, headless (dummy driver). Run with -extension RANDR: FreeRDP asks
# RandR first, which here describes screen 0 only, so without it FreeRDP
# finds both monitors through Xinerama. (Xvfb can't do this: it puts its
# Xinerama screens on top of each other and ignores xrandr --setmonitor)
Section "ServerFlags"
    Option "Xinerama" "on"
    Option "AutoAddDevices" "off"
EndSection
Section "Device"
    Identifier "card0"
    Driver "dummy"
    VideoRam 32768
EndSection
Section "Device"
    Identifier "card1"
    Driver "dummy"
    VideoRam 32768
EndSection
Section "Monitor"
    Identifier "mon"
    HorizSync 5.0 - 1000.0
    VertRefresh 5.0 - 200.0
    Modeline "800x600" 40.00 800 840 968 1056 600 601 605 628
EndSection
Section "Screen"
    Identifier "s0"
    Device "card0"
    Monitor "mon"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "800x600"
        Virtual 800 600
    EndSubSection
EndSection
Section "Screen"
    Identifier "s1"
    Device "card1"
    Monitor "mon"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "800x600"
        Virtual 800 600
    EndSubSection
EndSection
Section "ServerLayout"
    Identifier "two"
    Screen 0 "s0"
    Screen 1 "s1" RightOf "s0"
EndSection
